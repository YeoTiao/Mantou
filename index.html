<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exchange Companion</title>
<meta name="description" content="Budget, trips, flights, stays, timetable and deadlines for an exchange semester.">
<meta name="theme-color" content="#0B6E69">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Exchange">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app with a bottom tab bar; on wide screens the bar moves to the top and content caps at 760px. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#E3E9E8; --line:#D3DCDA;
  --fg:#14232B; --muted:#5B6B70; --accent:#0B6E69; --accent-ink:#FFFFFF; --accent-soft:#D5EBE8;
  --stamp:#B7791F; --stamp-soft:#F6E9D2; --good:#2E7D4F; --warn:#B7791F; --bad:#B3392F;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F181B; --surface:#172327; --sunk:#1E2C31; --line:#2A3B40;
  --fg:#E5EEEC; --muted:#93A6A9; --accent:#4FC1B8; --accent-ink:#06201E; --accent-soft:#183B3A;
  --stamp:#E3B15C; --stamp-soft:#3A2F1B; --good:#6CC891; --warn:#E3B15C; --bad:#EF7E72; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F181B; --surface:#172327; --sunk:#1E2C31; --line:#2A3B40;
  --fg:#E5EEEC; --muted:#93A6A9; --accent:#4FC1B8; --accent-ink:#06201E; --accent-soft:#183B3A;
  --stamp:#E3B15C; --stamp-soft:#3A2F1B; --good:#6CC891; --warn:#E3B15C; --bad:#EF7E72; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;line-height:1.1}
h2{font-size:1.2rem}
h3{font-size:1rem}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 110px;display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.sect-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:.9rem}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:.8rem}
.gate{max-width:420px;margin:12vh auto 0;padding:0 16px;text-align:center;align-items:center}
.gate h1{font-family:var(--display);font-size:2rem;margin:0}
.gate p{margin:0}
.brand-mark.big{width:64px;height:64px;font-size:1.1rem}
.gbtn{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;font-size:1rem}
.gbtn svg{background:#fff;border-radius:4px;padding:2px}
.save-pill{font-size:.75rem;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.save-pill.ok{background:var(--accent-soft);color:var(--accent)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{display:flex;width:100%;max-width:760px}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);cursor:pointer;border-radius:10px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs button:focus-visible{outline:2px solid var(--accent)}
@media (min-width:820px){
  nav.tabs{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-top:calc(6px + env(safe-area-inset-top,0px))}
  nav.tabs button{flex-direction:row;justify-content:center;gap:8px;font-size:.9rem;padding:8px}
  .wrap{padding-block:84px 48px}
}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:focus-visible,.chip:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;background:var(--sunk);border-radius:11px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* list items */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--sunk)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.item .r{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);letter-spacing:.02em}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.tag.stamp{background:var(--stamp-soft);color:var(--stamp)}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface);cursor:pointer}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done .t{text-decoration:line-through;color:var(--muted)}

/* hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero .eyebrow{color:inherit;opacity:.8;padding-right:84px}
.hero h1{font-size:2rem}
.hero .bar{height:8px;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);border-radius:99px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--accent-ink);border-radius:99px}
.hero .stampmark{position:absolute;right:-14px;top:-14px;width:110px;height:110px;border:2.5px dashed color-mix(in srgb,var(--accent-ink) 35%,transparent);border-radius:50%;display:grid;place-items:center;transform:rotate(-14deg);font-family:var(--mono);font-size:.7rem;text-align:center;line-height:1.2;opacity:.9}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat .v{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}

/* budget */
.meter{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.over i{background:var(--bad)}
.cat-row{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:.86rem}
.cat-row .meter{height:7px}

/* boarding pass */
.pass{display:grid;grid-template-columns:1fr auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;width:100%}
.pass .body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pass .stub{border-left:2px dashed var(--line);padding:14px 14px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:96px;background:var(--sunk)}
.iata{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-weight:700;font-size:1.6rem;letter-spacing:.02em}
.iata .line{flex:1;height:0;border-top:2px dotted var(--muted);position:relative;min-width:24px}
.iata small{display:block;font-family:var(--body);font-weight:500;font-size:.75rem;color:var(--muted);letter-spacing:0}

/* timetable */
.class{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.class:last-child{border-bottom:0}
.class .time{font-family:var(--mono);font-size:.82rem;line-height:1.3}
.class .code{font-family:var(--mono);font-size:.75rem;font-weight:700;color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.week .col{display:flex;flex-direction:column;gap:5px}
.week .dh{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
.week .blk{background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:5px 6px;font-size:.7rem;line-height:1.25;border:0;text-align:left;cursor:pointer;overflow:hidden}
.week .blk b{font-family:var(--mono);display:block;color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:620px){.scrim{align-items:center}.sheet{border-radius:18px}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.field.cb{flex-direction:row;align-items:center;gap:8px}
.field.cb input{width:auto}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
.hint{font-size:.76rem;color:var(--muted)}
.more-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--accent)}
.tile svg{width:22px;height:22px;color:var(--accent)}
.tile .s{font-size:.78rem;color:var(--muted)}
.banner{background:var(--stamp-soft);color:var(--fg);border-radius:var(--r);padding:12px 14px;font-size:.88rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.85rem;z-index:60}
.daygroup{font-size:.75rem;font-weight:600;color:var(--muted);padding:8px 14px 4px;background:var(--sunk);text-transform:uppercase;letter-spacing:.06em}
.tl{display:flex;flex-direction:column;gap:0}
@media (max-width:480px){.fields{grid-template-columns:1fr}.cat-row{grid-template-columns:80px 1fr auto}.iata{font-size:1.3rem}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>

</head>

<script>
(function(){
"use strict";
/* ---------- icons ---------- */
const I = {

  more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg>',

  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19V5"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>'
};

/* ---------- constants ---------- */
const CURRENCIES = ["SGD","EUR","GBP","USD","AUD","NZD","CAD","CHF","SEK","NOK","DKK","JPY","KRW","CNY","HKD","TWD","THB","MYR","IDR","INR"];
// Approximate value of 1 unit in SGD. Editable in Settings.
const DEFAULT_RATES_SGD = {SGD:1,EUR:1.50,GBP:1.73,USD:1.30,AUD:0.86,NZD:0.78,CAD:0.95,CHF:1.62,SEK:0.135,NOK:0.125,DKK:0.20,JPY:0.0088,KRW:0.00095,CNY:0.18,HKD:0.167,TWD:0.041,THB:0.039,MYR:0.30,IDR:0.00008,INR:0.0155};
const CATS = ["Rent","Food","Groceries","Transport","Travel","School","Fun","Shopping","Phone & bills","Other"];
const CAT_COLORS = {"Rent":"#6C5BA8","Food":"#D0743C","Groceries":"#4F9A55","Transport":"#2F7DB8","Travel":"#0B8A83","School":"#B08A1E","Fun":"#C2508A","Shopping":"#8C6A4E","Phone & bills":"#5E7681","Other":"#8A8F93","Shared trips":"#0B8A83"};
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const SECTIONS = ["settings","expenses","trips","plans","flights","stays","classes","deadlines","wallet","packing","contacts","places","journal","housing","bucket"];
// Lists that mirror the WooHoo Google Sheets (see sheets-sync/Code.gs).
const SHEET_GROUPS = ["Daily","Monthly","Pre-Trip","Travel"];
const SUB2CAT = {"Accoms":"Travel","Activity":"Fun","Baggage":"Travel","Food":"Food","Gym":"Fun","Haircut":"Other","Housing - Application":"Rent","Housing - Rent":"Rent","Housing - Security Deposit":"Rent","Laundry":"Other","Mobile Data":"Phone & bills","NIL":"Other","Others":"Other","Shopping":"Shopping","Shopping/Health":"Shopping","Transport - Car Hire":"Transport","Transport - Car Rental":"Transport","Transport - Flight":"Travel","Transport - Train/Bus":"Transport","Visa":"School"};
const CAT2SUB = {"Rent":"Housing - Rent","Food":"Food","Groceries":"Food","Transport":"Transport - Train/Bus","Travel":"Transport - Flight","School":"Others","Fun":"Activity","Shopping":"Shopping","Phone & bills":"Mobile Data","Other":"Others"};
const DECISIONS = ["hell yeah","uh think harder first","noh"];
const TIERS = ["Must go","Not must but like to go","Okay if convenient","If got time","Meh"];

const DEFAULT_SETTINGS = {city:"Madrid", country:"Spain", school:"IE University", start:"2027-01-11", end:"2027-05-28", home:"SGD", local:"EUR", myName:"", budget:1500, rates:Object.assign({},DEFAULT_RATES_SGD), hasExamples:false};

/* ---------- state ---------- */
let S = {};
function blank(){ const s={settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS))}; SECTIONS.slice(1).forEach(k=>s[k]=[]); return s; }
S = blank();
const ui = {tab:"home", travelSeg:"trips", schoolDay:null, month:null, more:null, openTrip:null, saveMode:"local", toast:null};
try { const t = localStorage.getItem("xc.tab"); if (t) ui.tab = t; } catch(e){}

/* ---------- storage: account (db) with device cache ---------- */
let db = null, uid = null; const pending = {}; let flushTimer = null;
function cacheLocal(){ try { localStorage.setItem("xc.data", JSON.stringify(S)); } catch(e){} }
function loadLocal(){ try { const raw = localStorage.getItem("xc.data"); if (raw){ const d = JSON.parse(raw); merge(d); return true; } } catch(e){} return false; }
function merge(d){ SECTIONS.forEach(k=>{ if (d && d[k] !== undefined) S[k] = k==="settings" ? Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), d[k]) : d[k]; }); if (!S.settings.rates) S.settings.rates = Object.assign({},DEFAULT_RATES_SGD); }
function save(...secs){ cacheLocal(); render(); cloudPush(secs.length?secs:SECTIONS); if (secs.some(k=>GS_SECS.includes(k))) gsSoon(); }
async function initStore(){
  loadLocal();
  render();
  initFirebase();
  gsSync(false);
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
}
function loadScript(src){ return new Promise((ok,bad)=>{ const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = bad; document.head.appendChild(el); }); }
/* ---------- accounts: Google sign-in, data per user in Firestore ----------
   users/{uid}            profile (name, email, lastSeen) + settings
   users/{uid}/{section}  one collection per data type (expenses, trips, flights, ...)
   The phone keeps a cached copy (xc.data) so the app opens instantly and works offline. */
const AUTH = {state:"loading", user:null, err:""};
const CLOUD = {uid:null, ref:null, remote:{}, first:{}, mode:"remote", unsub:[]};
async function initFirebase(){
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey){ SH.status = "unconfigured"; AUTH.state = "local"; render(); return; }
  SH.status = "loading";
  try {
    const v = "10.12.2", base = "https://www.gstatic.com/firebasejs/"+v+"/";
    await loadScript(base+"firebase-app-compat.js");
    await Promise.all([loadScript(base+"firebase-auth-compat.js"), loadScript(base+"firebase-firestore-compat.js")]);
    firebase.initializeApp(cfg);
    const fs = firebase.firestore();
    try { await fs.enablePersistence({synchronizeTabs:true}); } catch(e){}
    db = fs;
    firebase.auth().getRedirectResult().catch(e=>authError(e));
    firebase.auth().onAuthStateChanged(user=>onUser(user));
  } catch(e){
    SH.status = "offline";
    // Can't reach the sign-in service. Let someone who already signed in on this phone keep using the cached copy.
    AUTH.state = localOwner() ? "offline" : "noconn"; render();
  }
}
function localOwner(){ try { return localStorage.getItem("xc.owner"); } catch(e){ return null; } }
async function onUser(user){
  if (!user || user.isAnonymous){ AUTH.user = user; AUTH.state = "out"; SH.status = "off"; render(); return; }
  if (CLOUD.uid === user.uid) return;
  AUTH.user = user; AUTH.state = "in"; uid = user.uid;
  if (!S.settings.myName && user.displayName) S.settings.myName = user.displayName.split(" ")[0];
  render();
  await startCloud(user);
  await joinFromLink();
  startShared();
}
async function signIn(){
  const auth = firebase.auth(), p = new firebase.auth.GoogleAuthProvider(), cur = auth.currentUser;
  p.setCustomParameters({prompt:"select_account"});
  AUTH.err = ""; render();
  try {
    // An anonymous phone that already joined shared trips keeps its ID (and its trips) by linking.
    if (cur && cur.isAnonymous) { const r = await cur.linkWithPopup(p); onUser(r.user); }
    else await auth.signInWithPopup(p);
  } catch(e){
    if ((e.code==="auth/credential-already-in-use" || e.code==="auth/email-already-in-use") && e.credential){ try { await auth.signInWithCredential(e.credential); } catch(e2){ authError(e2); } }
    else if (e.code==="auth/popup-blocked" || e.code==="auth/operation-not-supported-in-this-environment" || e.code==="auth/cancelled-popup-request"){
      try { if (cur && cur.isAnonymous) await cur.linkWithRedirect(p); else await auth.signInWithRedirect(p); } catch(e2){ authError(e2); } }
    else authError(e);
  }
}
function authError(e){
  if (!e || e.code==="auth/popup-closed-by-user" || e.code==="auth/user-cancelled") return;
  AUTH.err = e.code==="auth/unauthorized-domain" ? "Sign-in isn't allowed on this web address yet. Add it under Firebase › Authentication › Settings › Authorized domains."
    : e.code==="auth/operation-not-allowed" ? "Google sign-in isn't switched on yet. Turn it on under Firebase › Authentication › Sign-in method."
    : e.code==="auth/network-request-failed" ? "No connection. Try again when you're online."
    : "Sign-in didn't work ("+(e.code||e.message||e)+").";
  render();
}
async function signOut(){
  CLOUD.unsub.forEach(u=>{ try{u();}catch(e){} }); CLOUD.unsub = []; CLOUD.uid = null; CLOUD.ref = null; CLOUD.remote = {}; CLOUD.first = {}; CLOUD.ready = false;
  Object.values(SH.subs).forEach(a=>a.forEach(u=>u())); SH.subs = {}; SH.trips = []; SH.exp = {}; SH.plans = {}; if (SH.unsub){ SH.unsub(); SH.unsub = null; }
  S = blank(); try { ["xc.data","xc.owner","xc.sync","xc.dirty"].forEach(k=>localStorage.removeItem(k)); } catch(e){}
  GS.st = {base:{}, tomb:{}, last:null, issues:{}};
  ui.tab = "home"; ui.more = null;
  try { await firebase.auth().signOut(); } catch(e){}
  render();
}
const clean = o => JSON.parse(JSON.stringify(o));
async function startCloud(user){
  const owner = localOwner(); let dirty = false; try { dirty = !!localStorage.getItem("xc.dirty"); } catch(e){}
  // First sign-in on this phone: upload what's here. Someone else's data on this phone: drop it. Otherwise the account is the truth.
  CLOUD.mode = !owner ? "merge" : owner!==user.uid ? "replace" : dirty ? "merge" : "remote";
  if (S.settings.hasExamples){ S = blank(); if (CLOUD.mode==="merge") CLOUD.mode = "replace"; }
  if (CLOUD.mode==="replace"){ S = blank(); GS.st = {base:{}, tomb:{}, last:null, issues:{}}; try { localStorage.removeItem("xc.sync"); } catch(e){} }
  CLOUD.uid = user.uid; CLOUD.ref = db.collection("users").doc(user.uid); CLOUD.remote = {}; CLOUD.first = {}; CLOUD.ready = false;
  const profile = {name:user.displayName||"", email:user.email||"", photo:user.photoURL||"", lastSeen:firebase.firestore.FieldValue.serverTimestamp(), app:"mantou"};
  try { const d = await CLOUD.ref.get(); if (!d.exists) profile.createdAt = firebase.firestore.FieldValue.serverTimestamp(); } catch(e){}
  CLOUD.ref.set(profile, {merge:true}).catch(()=>{});
  CLOUD.unsub.push(CLOUD.ref.onSnapshot(d=>{
    const rs = d.exists && d.data().settings;
    if (!CLOUD.first.settings){ CLOUD.first.settings = true;
      if (!rs || CLOUD.mode==="merge" && !rs.savedAt) { cloudPush(["settings"]); return gotFirst(); } }
    if (rs){ CLOUD.remote.settings = JSON.stringify(rs); S.settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), rs); if (!S.settings.rates) S.settings.rates = Object.assign({},DEFAULT_RATES_SGD); cacheLocal(); render(); }
    gotFirst();
  }, ()=>{}));
  SECTIONS.slice(1).forEach(sec=>{
    CLOUD.unsub.push(CLOUD.ref.collection(sec).onSnapshot(snap=>{
      const items = snap.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
      const map = new Map(items.map(it=>[it.id, JSON.stringify(clean(it))]));
      let next = items;
      if (!CLOUD.first[sec]){ CLOUD.first[sec] = true;
        if (CLOUD.mode==="merge"){ const extra = (S[sec]||[]).filter(it=>!map.has(it.id)); next = items.concat(extra); CLOUD.remote[sec] = map; S[sec] = keepOrder(S[sec], next); cloudPush([sec]); cacheLocal(); render(); gotFirst(); return; } }
      CLOUD.remote[sec] = map; S[sec] = keepOrder(S[sec], next); cacheLocal(); render(); gotFirst();
    }, ()=>{}));
  });
}
// Keep the phone's order for items it already has; new ones go at the end.
function keepOrder(old, next){ const pos = new Map((old||[]).map((x,i)=>[x.id,i])); return next.slice().sort((a,b)=>(pos.has(a.id)?pos.get(a.id):1e9)-(pos.has(b.id)?pos.get(b.id):1e9)); }
function gotFirst(){
  if (!CLOUD.uid || CLOUD.ready || !CLOUD.first.settings || SECTIONS.slice(1).some(k=>!CLOUD.first[k])) return;
  try { localStorage.setItem("xc.owner", CLOUD.uid); localStorage.removeItem("xc.dirty"); } catch(e){}
  CLOUD.mode = "remote"; CLOUD.ready = true; gsSoon();
}
function cloudPush(secs){
  if (!CLOUD.ref){ if (AUTH.state==="offline") try { localStorage.setItem("xc.dirty","1"); } catch(e){} return; }
  const writes = [];
  secs.forEach(sec=>{
    if (sec==="settings"){ if (!CLOUD.first.settings && CLOUD.mode!=="merge") return; const st = clean(Object.assign({}, S.settings, {savedAt:Date.now()})); const j = JSON.stringify(st);
      if (j!==CLOUD.remote.settings){ CLOUD.remote.settings = j; writes.push(b=>b.set(CLOUD.ref, {settings:st}, {mergeFields:["settings"]})); } return; }
    if (!CLOUD.first[sec] && CLOUD.mode!=="merge") return;   // not loaded yet: don't overwrite the account with a stale copy
    const remote = CLOUD.remote[sec] = CLOUD.remote[sec] || new Map(); const col = CLOUD.ref.collection(sec); const seen = new Set();
    (S[sec]||[]).forEach(it=>{ if (!it || !it.id) return; seen.add(it.id); const c = clean(it); const j = JSON.stringify(c);
      if (remote.get(it.id)!==j){ remote.set(it.id, j); writes.push(b=>b.set(col.doc(it.id), c)); } });
    [...remote.keys()].forEach(id=>{ if (!seen.has(id)){ remote.delete(id); writes.push(b=>b.delete(col.doc(id))); } });
  });
  for (let i=0; i<writes.length; i+=400){ const b = db.batch(); writes.slice(i,i+400).forEach(w=>w(b)); b.commit().catch(e=>toast("Couldn't save to your account: "+(e.code||e.message))); }
}
function viewGate(){
  const busy = AUTH.state==="loading";
  const msg = AUTH.state==="noconn" ? "You're offline. Connect to the internet to sign in." : "";
  return `<div class="gate stack"><div class="brand-mark big" aria-hidden="true">MAD</div><h1>Exchange Companion</h1>
    <p class="muted">Budget, trips, flights, flats, timetable and bill splitting for your exchange. Sign in to keep everything in your account and use it on any phone.</p>
    ${busy?`<div class="muted small">Loading…</div>`:AUTH.state==="noconn"?`<div class="small">${msg}</div>`:`<button class="btn primary gbtn" data-act="signIn"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.2-2.1 3.5-5.1 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.4 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.6.4-2.4V6.5H1.4C.5 8.2 0 10 0 12s.5 3.8 1.4 5.5z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.6 1.4 6.5l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/></svg>Continue with Google</button>`}
    ${AUTH.err?`<div class="small" style="color:var(--bad)">${esc(AUTH.err)}</div>`:""}
    ${localOwner()===null && SECTIONS.slice(1).some(k=>(S[k]||[]).length && !S.settings.hasExamples)?`<div class="small muted">What's already on this phone will be moved into your account.</div>`:""}
    <div class="small muted">Signing in with Google gives the app your name and email only. Nothing is posted to your Google account.</div></div>`;
}
async function joinFromLink(){
  const m = location.hash.match(/^#join=([A-Za-z0-9_-]{6,40})$/); if (!m) return;
  history.replaceState(null, "", location.pathname + location.search);
  try { await db.collection("shared").doc(m[1]).update({memberUids: firebase.firestore.FieldValue.arrayUnion(uid)});
    ui.tab = "travel"; ui.travelSeg = "friends"; SH.open = m[1]; SH.seg = "plan"; SH.waitUntil = Date.now()+5000; toast("You've joined the trip");
  } catch(e){ toast("That invite link didn't work. Ask for a new one."); }
}

/* ---------- helpers ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uidGen = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => iso(new Date());
const parseD = s => { if(!s) return null; const [y,m,d] = s.slice(0,10).split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a,b) => Math.round((parseD(b)-parseD(a))/864e5);
const fmtD = (s,opts) => s ? parseD(s).toLocaleDateString(undefined, opts||{day:"numeric",month:"short"}) : "";
const fmtDW = s => fmtD(s,{weekday:"short",day:"numeric",month:"short"});
const fmtTime = s => s && s.length>10 ? s.slice(11,16) : "";
const dowIdx = s => (parseD(s).getDay()+6)%7;
function rate(cur){ const r = S.settings.rates||{}; const home = S.settings.home; if (cur===home) return 1; const a = r[cur], b = r[home]; if (a==null) return 1; return b ? a/b : a; }
// rates are stored as "1 unit = x SGD"; convert via SGD so the home currency can change.
const toHome = (amt,cur) => (Number(amt)||0) * rate(cur||S.settings.home);
function money(v,cur,dp){ cur = cur||S.settings.home; const n = Number(v)||0; const d = dp!=null?dp:(["JPY","KRW","IDR"].includes(cur)?0:(Math.abs(n)>=1000?0:2));
  return cur+" "+n.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}); }
function myShare(e){ if (e.settle) return 0; const others = splitNames(e.splitWith); return toHome(e.amount,e.cur)/(others.length+1); }
function splitNames(s){ return String(s||"").split(",").map(x=>x.trim()).filter(Boolean).filter(x=>x.toLowerCase()!=="me"); }
const isMe = p => !p || p.trim().toLowerCase()==="me";
function toast(msg){ ui.toast = msg; renderToast(); clearTimeout(toast.t); toast.t = setTimeout(()=>{ui.toast=null;renderToast();},2200); }
function renderToast(){ let el = document.getElementById("toast"); if (!ui.toast){ if (el) el.remove(); return; } if(!el){ el=document.createElement("div"); el.id="toast"; el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el);} el.textContent = ui.toast; }

/* ---------- sheet (add / edit) ---------- */
let sheet = null; // {sec, id, preset, confirmDelete}
function openSheet(sec, id, preset){ sheet = {sec, id:id||null, preset:preset||{}, confirmDelete:false}; renderSheet(); }
function closeSheet(){ sheet = null; renderSheet(); }
function renderSheet(){
  const root = document.getElementById("sheetRoot");
  if (!sheet){ root.innerHTML = ""; return; }
  if (sheet.sec === "settings") return renderSettingsSheet(root);
  const sc = SCHEMA[sheet.sec]; const shared = sheet.sec.startsWith("shared");
  const pool = !shared ? S[sheet.sec] : sheet.sec==="sharedTrips" ? SH.trips : sheet.sec==="sharedExp" ? (SH.exp[SH.open]||[]) : (SH.plans[SH.open]||[]);
  const rec = sheet.id ? pool.find(x=>x.id===sheet.id) : null;
  const val = f => { if (rec && rec[f.k]!==undefined) return Array.isArray(rec[f.k]) && f.type!=="multi" ? rec[f.k].join(", ") : rec[f.k]; if (sheet.preset[f.k]!==undefined) return sheet.preset[f.k]; return typeof f.def==="function"?f.def():(f.def!=null?f.def:""); };
  const fh = sc.fields.map(f=>{
    const id = "f_"+f.k, v = val(f), cls = "field"+(f.full||f.type==="textarea"?" full":"")+(f.type==="checkbox"?" cb":"");
    let input;
    if (f.type==="select") input = `<select id="${id}">${f.opts().map(([k,l])=>`<option value="${esc(k)}"${String(v)===String(k)?" selected":""}>${esc(l)}</option>`).join("")}</select>`;
    else if (f.type==="textarea") input = `<textarea id="${id}">${esc(v)}</textarea>`;
    else if (f.type==="multi") input = `<div class="row" id="${id}">${f.opts().map((m,i)=>`<label class="chip" style="display:flex;gap:6px;align-items:center"><input type="checkbox" value="${esc(m)}"${(v||[]).includes(m)?" checked":""}>${esc(m)}</label>`).join("")}</div>`;
    else if (f.type==="checkbox") return `<div class="${cls}"><input type="checkbox" id="${id}"${v?" checked":""}><label for="${id}" style="color:var(--fg)">${esc(f.label)}</label></div>`;
    else input = `<input id="${id}" type="${f.type}"${f.type==="number"?' step="any" inputmode="decimal"':""} value="${esc(v)}"${f.req?" required":""}${f.upper?' style="text-transform:uppercase"':""}>`;
    return `<div class="${cls}"><label for="${id}">${esc(f.label)}${f.req?"":' <span style="font-weight:400">(optional)</span>'}</label>${input}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}</div>`;
  }).join("");
  root.innerHTML = `<div class="scrim" data-act="scrim"><form class="sheet" id="sheetForm" role="dialog" aria-modal="true" aria-label="${esc(sc.title)}">
    <div class="row between"><h2>${rec?"Edit":"Add"} ${esc(sc.title.toLowerCase())}</h2><button type="button" class="btn ghost" data-act="close">Cancel</button></div>
    <div class="fields">${fh}</div>
    <div id="formErr" class="small" style="color:var(--bad)"></div>
    <div class="row between">${rec?`<button type="button" class="btn danger" data-act="del">${sheet.confirmDelete?"Tap again to delete":"Delete"}</button>`:"<span></span>"}<button class="btn primary" type="submit">Save</button></div>
  </form></div>`;
  const first = root.querySelector("input,select,textarea"); if (first && !rec) setTimeout(()=>first.focus(),30);
  root.querySelector("#sheetForm").addEventListener("submit", ev=>{
    ev.preventDefault();
    const out = rec ? Object.assign({},rec) : Object.assign({id:uidGen()}, sheet.preset);
    for (const f of sc.fields){
      const el = document.getElementById("f_"+f.k);
      let v = f.type==="checkbox" ? el.checked : f.type==="multi" ? [...el.querySelectorAll("input:checked")].map(x=>x.value) : el.value.trim();
      if (f.upper && typeof v==="string") v = v.toUpperCase();
      if (f.type==="number" && v!=="") v = Number(v);
      if (f.type==="multi" && !v.length){ document.getElementById("formErr").textContent = "Pick at least one person to split with."; return; }
      if (f.req && (v===""||v==null)){ document.getElementById("formErr").textContent = f.label+" is needed."; el.focus(); return; }
      out[f.k] = v;
    }
    if ((sheet.sec==="trips"||sheet.sec==="sharedTrips") && out.end < out.start){ document.getElementById("formErr").textContent = "The trip ends before it starts. Check the dates."; return; }
    if (sheet.sec==="stays" && out.checkout < out.checkin){ document.getElementById("formErr").textContent = "Check-out is before check-in. Check the dates."; return; }
    if (shared){
      const sec = sheet.sec;
      if (sec==="sharedTrips"){ out.members = [...new Set(String(out.members).split(",").map(x=>x.trim()).filter(Boolean))]; if (!rec){ out.createdAt = Date.now(); out.memberUids = [uid]; out.id = db.collection("shared").doc().id; } }
      const tid = sec==="sharedTrips" ? out.id : SH.open;
      if (sec==="sharedExp"){ const tr = shTrip(tid); out.tripAmt = Math.round(Number(out.amount)*rate(out.cur)/rate(tr.cur||"EUR")*100)/100; }
      if (sec==="sharedPlans" && !rec) out.by = myName();
      closeSheet(); shWrite(sec, tid, out).then(ok=>{ if (ok){ toast(rec?"Saved":"Added"); if (sec==="sharedTrips" && !rec){ SH.open = out.id; SH.seg = "plan"; SH.waitUntil = Date.now()+5000; render(); } } });
      return;
    }
    const list = S[sheet.sec]; const i = list.findIndex(x=>x.id===out.id);
    if (i>=0) list[i] = out; else list.push(out);
    const sec = sheet.sec; closeSheet(); save(sec); toast(rec?"Saved":"Added");
  });
}

function viewHome(){

    else { head = `Day ${into+1} of ${total+1}`; sub = `${daysBetween(t,st.end)} days left, ends ${fmtDW(st.end)}`; pct = Math.round(into/total*100); }
    hero = `<section class="hero"><div class="stampmark" aria-hidden="true">${esc((st.city||"EXCHANGE").toUpperCase().slice(0,12))}<br>${esc(st.start.slice(0,4))}</div>

  }

  S.stays.filter(s=>s.checkin>=t).sort((a,b)=>a.checkin.localeCompare(b.checkin)).slice(0,1).forEach(s=>next.push({d:s.checkin,h:`<button class="item" data-act="edit" data-sec="stays" data-id="${s.id}"><span class="tag stamp">Stay</span><div class="main"><div class="t">${esc(s.name)}</div><div class="s">Check in ${fmtDW(s.checkin)}</div></div><div class="r small muted">${rel(s.checkin)}</div></button>`}));
  S.deadlines.filter(d=>!d.done && d.due>=t).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,3).forEach(d=>next.push({d:d.due,h:deadlineRow(d)}));
  S.trips.filter(tr=>tr.start>=t).sort((a,b)=>a.start.localeCompare(b.start)).slice(0,1).forEach(tr=>next.push({d:tr.start,h:`<button class="item" data-act="trip" data-id="${tr.id}"><span class="tag">Trip</span><div class="main"><div class="t">${esc(tr.name)}</div><div class="s">${fmtD(tr.start)} – ${fmtD(tr.end)}</div></div><div class="r small muted">${rel(tr.start)}</div></button>`}));
  IE_CAL.filter(c=>c.d>=t && c.k!=="term").slice(0,1).forEach(c=>next.push({d:c.d,h:`<button class="item" data-act="tab" data-k="school"><span class="tag ${c.k==="hol"?"bad":"accent"}">${c.k==="hol"?"Holiday":"Break"}</span><div class="main"><div class="t">${esc(c.t)}</div><div class="s">${fmtDW(c.d)}${c.e?" – "+fmtDW(c.e):""}</div></div><div class="r small muted">${rel(c.d)}</div></button>`}));

function rel(s){ const n = daysBetween(today(), s.slice(0,10)); if (n===0) return "today"; if (n===1) return "tomorrow"; if (n===-1) return "yesterday"; return n>0 ? `in ${n} days` : `${-n} days ago`; }

function monthExpenses(m){ return S.expenses.filter(e=>(e.date||"").slice(0,7)===m); }
function budgetCard(m, compact){
  const st = S.settings, ex = monthExpenses(m), shm = sharedMine(m), shSum = shm.reduce((s,x)=>s+x.share,0), spent = ex.reduce((s,e)=>s+myShare(e),0) + shSum, b = Number(st.budget)||0;
  const pct = b ? Math.min(100, spent/b*100) : 0, over = b && spent > b;
  const [y,mo] = m.split("-").map(Number); const dim = new Date(y,mo,0).getDate();
  const isCur = m===today().slice(0,7); const dayN = isCur ? new Date().getDate() : dim;
  const perDay = b ? (b - spent) / Math.max(1, dim - dayN + (isCur?1:0)) : 0;
  let cats = "";
  if (!compact){
    const by = {}; ex.forEach(e=>{ if (e.settle) return; by[e.cat||"Other"] = (by[e.cat||"Other"]||0) + myShare(e); }); if (shSum) by["Shared trips"] = shSum;
    const rows = Object.entries(by).sort((a,b)=>b[1]-a[1]); const max = rows.length ? rows[0][1] : 1;
    cats = rows.length ? `<div class="stack" style="gap:8px;margin-top:6px">${rows.map(([c,v])=>`<div class="cat-row"><span>${esc(c)}</span><div class="meter"><i style="width:${v/max*100}%;background:${CAT_COLORS[c]||"var(--accent)"}"></i></div><span class="num">${money(v,null,0)}</span></div>`).join("")}</div>` : "";
  }
  return `<div class="card stack">
    <div class="row between"><div><div class="eyebrow">Spent${b?" of "+money(b,null,0):""}</div><div class="stat"><span class="v">${money(spent,null,0)}</span></div></div>
    ${b?`<div style="text-align:right"><div class="eyebrow">${over?"Over by":"Left"}</div><div class="num" style="font-weight:600;color:${over?"var(--bad)":"var(--good)"}">${money(Math.abs(b-spent),null,0)}</div>${isCur&&!over?`<div class="small muted num">${money(perDay,null,0)} a day</div>`:""}</div>`:`<button class="btn sm" data-act="settings">Set a budget</button>`}</div>
    ${b?`<div class="meter${over?" over":""}" role="img" aria-label="${Math.round(pct)}% of budget used"><i style="width:${pct}%"></i></div>`:""}
    ${S.settings.home!==S.settings.local?`<div class="small muted num">1 ${esc(S.settings.local)} ≈ ${money(rate(S.settings.local),null,3)} · your share of split bills only</div>`:""}
    ${cats}</div>`;
}

function viewMoney(){

    : `<div class="empty">All square. Put friends' names in "Split with" on an expense and the app works out who owes who.</div>`;
  const total = S.expenses.reduce((s,e)=>s+myShare(e),0);

  return topBar("Money", `All amounts in ${S.settings.home} unless shown`) + examplesBanner() +

    `<section class="stack"><h2>Split with friends</h2>${balH}</section>` +

}

/* ---------- Google Sheets two-way sync ----------
   Talks to the Apps Script web app in sheets-sync/Code.gs. Each sync pulls every linked
   tab, compares each row with the app and with the last synced copy (GS.st.base), and
   sends back only what changed in the app. If both sides changed the same row, the sheet wins.
   Rows are only deleted from a sheet when they were deleted in the app (tombstones), so
   erasing the app or importing a backup never empties a sheet. */
const GS_SECS = ["expenses","housing","bucket"];
const GS_FIELDS = {
  expenses:{date:"date",group:"text",sub:"text",city:"text",item:"text",eur:"num",sgd:"num",remarks:"text"},
  housing:{decision:"text",link:"text",eur:"num",location:"text",metro:"num",size:"num",beds:"num",baths:"num",floor:"num",notes:"text",nearby:"text"},
  bucket:{tierG:"text",country:"text",city:"text",start:"date",end:"date",todo:"text"}
};
const GS = {busy:false, again:false, timer:null, err:"", st:{base:{}, tomb:{}, last:null, issues:{}}};
try { const raw = localStorage.getItem("xc.sync"); if (raw) Object.assign(GS.st, JSON.parse(raw)); } catch(e){}
function gsStore(){ try { localStorage.setItem("xc.sync", JSON.stringify(GS.st)); } catch(e){} }
const r2 = x => Math.round(x*100)/100;
function gsNorm(type, x){
  if (type==="num"){ if (x===""||x==null) return ""; const n = Number(x); return isNaN(n) ? "" : r2(n); }
  return String(x==null?"":x).replace(/\r\n?/g,"\n");
}
function gsHash(sec, v){ const f = GS_FIELDS[sec]; return JSON.stringify(Object.keys(f).map(k=>gsNorm(f[k], v[k]))); }
function gsAutoGroup(e){
  if (e.date && S.settings.start && e.date < S.settings.start) return "Pre-Trip";
  if (e.tripId || e.cat==="Travel") return "Travel";
  if (e.cat==="Rent" || e.cat==="Phone & bills") return "Monthly";
  return "Daily";
}
// app item -> the sheet's columns
function gsToV(sec, it){
  if (sec!=="expenses"){ const v = {}; Object.keys(GS_FIELDS[sec]).forEach(k=>v[k]=it[k]==null?"":it[k]); return v; }
  const amt = Number(it.amount)||0; let eur = 0, sgd = 0;
  if (it.cur==="EUR") eur = amt;
  else if (it.cur==="SGD"){ sgd = amt; eur = Number(it.eurRef)||0; }
  else eur = r2(amt*rate(it.cur)/rate("EUR"));
  const sub = it.sub!==undefined && (SUB2CAT[it.sub]||"Other")===it.cat ? it.sub : (CAT2SUB[it.cat]||"Others");
  return {date:it.date||"", group:it.group||gsAutoGroup(it), sub, city:it.city||"", item:it.note||"", eur, sgd, remarks:it.remarks||""};
}
// sheet row -> app item (keeps app-only fields like trip, split and paid by)
function gsFromV(sec, row, old){
  const it = Object.assign({}, old||{id:row.id}, row.ro||{});
  if (sec!=="expenses"){ Object.assign(it, row.v); return it; }
  const v = row.v, eur = Number(v.eur)||0, sgd = Number(v.sgd)||0;
  if (sgd){ it.amount = sgd; it.cur = "SGD"; it.eurRef = eur||undefined; }
  else { it.amount = eur; it.cur = "EUR"; delete it.eurRef; }
  Object.assign(it, {date:v.date, group:v.group, sub:v.sub, cat:SUB2CAT[v.sub]||"Other", city:v.city, note:v.item, remarks:v.remarks});
  if (!old){ it.paidBy = "me"; it.splitWith = ""; it.tripId = ""; }
  return it;
}
const gsSyncable = (sec, it) => !(sec==="expenses" && it.settle);
function gsTomb(sec, id){ if (!GS_SECS.includes(sec) || GS.st.base[id]===undefined) return; (GS.st.tomb[sec] = GS.st.tomb[sec]||[]).push(id); gsStore(); }
function gsSoon(){ if (!S.settings.gsync || GS.applying) return; clearTimeout(GS.timer); GS.timer = setTimeout(()=>gsSync(false), 2500); }

async function gsSync(manual){
  // With accounts on, only sync once the account's copy has loaded, or stale phone data could overwrite the sheet.
  const cfg = S.settings.gsync; if (!cfg || AUTH.state!=="local" && !(AUTH.state==="in" && CLOUD.ready)) return;
  if (S.settings.hasExamples){ GS.err = "Clear the example data first, so it doesn't end up in your sheets."; render(); return; }
  if (GS.busy){ GS.again = true; return; }
  GS.busy = true; GS.err = ""; if (manual) render();
  try {
    const res = await fetch(cfg.url + (cfg.url.includes("?")?"&":"?") + "t=" + encodeURIComponent(cfg.token) + "&_=" + Date.now(), {redirect:"follow"});
    const pull = await res.json();
    if (!pull.ok) throw new Error(pull.error||"The sheet script refused the request");
    if (pull.eurSgd > 0) S.settings.rates.EUR = pull.eurSgd;
    const base = GS.st.base, ops = [], issues = {};
    let changed = 0;
    for (const sec of GS_SECS){
      const tab = pull.tabs && pull.tabs[sec];
      if (!tab || tab.error){ issues[sec] = tab ? tab.error : "Not returned"; continue; }
      const tomb = new Set(GS.st.tomb[sec]||[]);
      const inSheet = new Set(tab.rows.map(r=>r.id));
      const list = S[sec] = S[sec]||[];
      for (const row of tab.rows){
        const s = gsHash(sec, row.v), b = base[row.id];
        const i = list.findIndex(x=>x.id===row.id);
        if (i>=0){
          const a = gsHash(sec, gsToV(sec, list[i]));
          if (a===s){ base[row.id] = s; Object.assign(list[i], row.ro||{}); }
          else if (s!==b){ list[i] = gsFromV(sec, row, list[i]); base[row.id] = s; changed++; } // sheet changed (or both did: sheet wins)
          else ops.push({sec, op:"upsert", id:row.id, v:gsToV(sec, list[i])});                                       // only the app changed
        } else if (tomb.has(row.id)) ops.push({sec, op:"delete", id:row.id});
        else { list.push(gsFromV(sec, row, null)); base[row.id] = s; changed++; }
      }
      for (const it of list.slice()){
        if (inSheet.has(it.id) || !gsSyncable(sec, it)) continue;
        const b = base[it.id];
        if (b!==undefined && gsHash(sec, gsToV(sec, it))===b){ S[sec] = S[sec].filter(x=>x.id!==it.id); delete base[it.id]; changed++; } // deleted in the sheet
        else ops.push({sec, op:"upsert", id:it.id, v:gsToV(sec, it)});                                                                   // new in the app (or edited after the sheet row went)
      }
      GS.st.tomb[sec] = [...tomb].filter(id=>inSheet.has(id));
    }
    let failed = 0;
    if (ops.length){
      const pr = await fetch(cfg.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({t:cfg.token, ops}), redirect:"follow"});
      const out = await pr.json();
      if (!out.ok) throw new Error(out.error||"The sheet script refused the changes");
      const okIds = new Set((out.results||[]).filter(r=>r.ok).map(r=>r.id));
      for (const o of ops){
        if (!okIds.has(o.id)){ failed++; const e = (out.results||[]).find(r=>r.id===o.id); if (e && e.error) issues[o.sec] = e.error; continue; }
        if (o.op==="upsert") base[o.id] = gsHash(o.sec, o.v);
        else { delete base[o.id]; GS.st.tomb[o.sec] = (GS.st.tomb[o.sec]||[]).filter(x=>x!==o.id); }
      }
    }
    GS.st.last = new Date().toISOString(); GS.st.issues = issues; gsStore();
    GS.applying = true; cacheLocal(); render(); cloudPush(["settings"].concat(GS_SECS)); GS.applying = false;
    if (manual) toast(failed ? failed+" change"+(failed>1?"s":"")+" didn't save to the sheet" : "Synced"+(changed||ops.length?` · ${changed} in, ${ops.length-failed} out`:""));
  } catch(e){
    GS.err = navigator.onLine===false ? "You're offline. Changes will sync when you're back online." : "Couldn't sync: " + (e && e.message || e);
    render();
  } finally {
    GS.busy = false;
    if (GS.again){ GS.again = false; gsSoon(); }
  }
}
function gsHint(){
  if (!S.settings.gsync) return "";
  return `<div class="row between small muted"><span>${GS.busy?"Syncing with Google Sheets…":GS.st.last?"Synced with Google Sheets "+relTime(GS.st.last):"Linked to Google Sheets"}</span><button class="btn ghost sm" data-act="gsNow">Sync now</button></div>`;
}
function relTime(iso){ const m = Math.round((Date.now()-new Date(iso))/60000); return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":fmtD(iso.slice(0,10)); }

    <div class="row"><button class="btn sm" data-act="gsNow">Sync now</button><button class="btn sm ghost" data-act="gsOff">Unlink</button></div></div>`;
}

  const isOff = x => off.has(x) || dowIdx(x)>=5;
  const seen = new Set(), out = [];
  const seeds = IE_CAL.filter(c=>c.k==="hol"||c.k==="break").map(c=>c.d);
  seeds.forEach(s=>{ if (seen.has(s)) return; let a = s, b = s;
    while (isOff(addDays(a,-1))) a = addDays(a,-1);
    while (isOff(addDays(b,1))) b = addDays(b,1);
    for (let x=a; x<=b; x=addDays(x,1)) seen.add(x);
    const n = daysBetween(a,b)+1; if (n<3) return;
    const brk = IE_CAL.find(c=>c.k==="break" && c.d<=b && c.e>=a);
    const hols = IE_CAL.filter(c=>c.k==="hol" && c.d>=a && c.d<=b);
    out.push({a,b,n,label: brk ? brk.t : (n>=4?"Long weekend (bridge)":"Long weekend"), why: brk?"":hols.map(h=>h.t+" "+fmtD(h.d)).join(", ")});
  });
  return out.sort((x,y)=>x.a.localeCompare(y.a));
}
function calRow(c){
  const tag = c.k==="hol"?'<span class="tag bad">Holiday</span>':c.k==="break"?'<span class="tag accent">Break</span>':c.k==="exam"?'<span class="tag stamp">Retakes</span>':'<span class="tag">Classes</span>';
  return `<div class="item" style="cursor:default"><div class="main"><div class="t">${esc(c.t)}</div><div class="s">${fmtDW(c.d)}${c.e?" – "+fmtDW(c.e):""}</div></div><div class="r">${tag}<div class="small muted">${c.d>=today()?rel(c.d):""}</div></div></div>`;
}
function freeList(limit){
  const t = today(); const bl = freeBlocks().filter(b=>b.b>=t).slice(0,limit||99);
  if (!bl.length) return `<div class="empty">No more holidays or breaks in the IE calendar.</div>`;
  return `<div class="list">${bl.map(b=>`<div class="item" style="cursor:default"><div class="main"><div class="t">${esc(b.label)} <span class="tag good">${b.n} days off</span></div><div class="s">${fmtDW(b.a)} – ${fmtDW(b.b)}${b.why?" · "+esc(b.why):""}</div></div><button class="btn sm" data-act="add" data-sec="trips" data-date="${b.a}" data-end="${b.b}">Plan trip</button></div>`).join("")}</div>`;
}

/* ---------- shared trips (visible to everyone the page is shared with) ---------- */
const SH = {status:"off", trips:[], exp:{}, plans:{}, subs:{}, open:null, seg:"plan", canWrite:true};
function startShared(){
  SH.status = "loading";
  try {
    if (SH.unsub) SH.unsub();
    SH.unsub = db.collection("shared").where("memberUids","array-contains",uid).onSnapshot(snap=>{
      SH.trips = snap.docs.filter(d=>d.exists).map(d=>Object.assign({}, d.data(), {id:d.id}));
      const ids = new Set(SH.trips.map(t=>t.id));
      SH.trips.forEach(t=>{ if (SH.subs[t.id]) return; const ref = db.collection("shared").doc(t.id);
        SH.subs[t.id] = [
          ref.collection("expenses").onSnapshot(s=>{ SH.exp[t.id] = s.docs.filter(d=>d.exists).map(d=>Object.assign({}, d.data(), {id:d.id})); render(); }, ()=>{}),
          ref.collection("plans").onSnapshot(s=>{ SH.plans[t.id] = s.docs.filter(d=>d.exists).map(d=>Object.assign({}, d.data(), {id:d.id})); render(); }, ()=>{})
        ]; });
      Object.keys(SH.subs).forEach(id=>{ if (!ids.has(id)){ SH.subs[id].forEach(u=>u()); delete SH.subs[id]; delete SH.exp[id]; delete SH.plans[id]; } });
      SH.status = "ready"; render();
    }, e=>{ SH.status = "error"; SH.err = e && e.code; render(); });
  } catch(e){ SH.status = "error"; render(); }
}
const myName = () => (S.settings.myName||"").trim();
const sameName = (a,b) => String(a||"").trim().toLowerCase() === String(b||"").trim().toLowerCase();
function shTrip(id){ return SH.trips.find(t=>t.id===id); }
// Net balance per member in the trip's currency: positive = is owed money.
function shBalances(tid){
  const bal = {}; const tr = shTrip(tid); (tr.members||[]).forEach(m=>bal[m]=0);
  (SH.exp[tid]||[]).forEach(e=>{
    const amt = Number(e.tripAmt)||0;
    if (e.transfer){ bal[e.from]=(bal[e.from]||0)+amt; bal[e.to]=(bal[e.to]||0)-amt; return; }
    const sp = (e.split&&e.split.length)?e.split:(tr.members||[]);
    bal[e.paidBy]=(bal[e.paidBy]||0)+amt; sp.forEach(m=>bal[m]=(bal[m]||0)-amt/sp.length);
  });
  return bal;
}
function shSettle(bal){
  const cr = Object.entries(bal).filter(([,v])=>v>0.005).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
  const db_ = Object.entries(bal).filter(([,v])=>v<-0.005).map(([n,v])=>({n,v:-v})).sort((a,b)=>b.v-a.v);
  const out = []; let i=0,j=0;
  while (i<db_.length && j<cr.length){ const x = Math.min(db_[i].v, cr[j].v); out.push({from:db_[i].n,to:cr[j].n,amt:x}); db_[i].v-=x; cr[j].v-=x; if (db_[i].v<0.005) i++; if (cr[j].v<0.005) j++; }
  return out;
}
// My share of shared-trip spending, in home currency, for the personal budget.
function sharedMine(month){
  const me = myName(); if (!me) return [];
  const out = [];
  SH.trips.forEach(tr=>{ (SH.exp[tr.id]||[]).forEach(e=>{ if (e.transfer || (month && (e.date||"").slice(0,7)!==month)) return;
    const sp = (e.split&&e.split.length)?e.split:(tr.members||[]); if (!sp.some(m=>sameName(m,me))) return;
    out.push({date:e.date, share:(Number(e.tripAmt)||0)/sp.length*rate(tr.cur||"EUR")}); }); });
  return out;
}
function friendsView(){
  if (SH.status==="unconfigured") return `<div class="card stack"><h3>Sharing isn't switched on yet</h3><div class="small">Shared trips need a free online database. The setup steps are in the README that comes with the app.</div></div>`;
  if (SH.status==="offline") return `<div class="empty">You're offline, so shared trips can't load. Everything else still works.</div>`;
  if (SH.status!=="ready") return SH.status==="error" ? `<div class="empty">Shared trips couldn't load. Reload the page to try again.</div>` : `<div class="empty">Loading shared trips…</div>`;
  if (SH.open && shTrip(SH.open)) return sharedDetail(SH.open);
  if (SH.open && SH.waitUntil > Date.now()) return `<div class="empty">Creating the trip…</div>`;
  SH.open = null;
  const t = today(); const trips = SH.trips.slice().sort((a,b)=>(a.start||"").localeCompare(b.start||""));
  const row = tr => { const me = myName(); const bal = me ? shBalances(tr.id)[(tr.members||[]).find(m=>sameName(m,me))] : null; const n = (SH.exp[tr.id]||[]).filter(e=>!e.transfer).length;
    return `<button class="item" data-act="shOpen" data-id="${tr.id}"><div class="main"><div class="t">${esc(tr.name)}</div><div class="s">${esc(tr.dest||"")} · ${fmtD(tr.start)} – ${fmtD(tr.end)} · ${(tr.members||[]).map(esc).join(", ")}</div></div><div class="r small num">${bal!=null&&Math.abs(bal)>0.005?`<span style="color:${bal>0?"var(--good)":"var(--bad)"}">${bal>0?"owed ":"you owe "}${money(Math.abs(bal),tr.cur)}</span>`:`<span class="muted">${n} expense${n===1?"":"s"}</span>`}</div></button>`; };
  const up = trips.filter(x=>(x.end||"")>=t), past = trips.filter(x=>(x.end||"")<t);
  return `${myName()?"":`<div class="banner"><span>Set the name your friends know you by so the app can tell which share is yours.</span><button class="btn sm" data-act="settings">Set my name</button></div>`}
    <button class="btn primary" data-act="add" data-sec="sharedTrips">Start a shared trip</button>
    <section class="stack"><h2>Shared trips</h2>${up.length?`<div class="list">${up.map(row).join("")}</div>`:`<div class="empty">No shared trips yet. Start one, add your friends' names, and everyone can add plans and expenses.</div>`}</section>
    ${past.length?`<section class="stack"><h2>Past</h2><div class="list">${past.reverse().map(row).join("")}</div></section>`:""}
    <details class="card"><summary style="cursor:pointer;font-weight:600">How to add friends</summary><div class="small stack" style="margin-top:8px">
      <div>Open a trip and tap <b>Invite friends</b>. Send the link however you like. When a friend opens it on any phone, iPhone or Android, they join the trip. No account or app store needed.</div>
      <div>Friends only see the trips they're invited to. Your budget, documents, timetable and notes never leave your phone.</div>
      <div class="muted">Anyone with the invite link can join, so send it only to the people going.</div></div></details>`;
}
function sharedDetail(id){
  const tr = shTrip(id), cur = tr.cur||"EUR", me = myName(), members = tr.members||[];
  const exp = (SH.exp[id]||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const total = exp.filter(e=>!e.transfer).reduce((s,e)=>s+(Number(e.tripAmt)||0),0);
  const seg = SH.seg;
  const segH = `<div class="seg" role="group" aria-label="Shared trip view">${[["plan","Plan"],["exp","Expenses"],["bal","Who owes who"]].map(([k,l])=>`<button data-act="shSeg" data-k="${k}" aria-pressed="${seg===k}">${l}</button>`).join("")}</div>`;
  let body = "";
  if (seg==="plan"){
    const days = []; if (tr.start && tr.end) for (let d=tr.start; d<=tr.end && days.length<60; d=addDays(d,1)) days.push(d);
    const plans = SH.plans[id]||[];
    body = `<div class="list tl">${days.map((d,i)=>{ const its = plans.filter(p=>p.date===d).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
      return `<div class="daygroup row between"><span>Day ${i+1} · ${fmtDW(d)}</span><button class="btn ghost sm" data-act="add" data-sec="sharedPlans" data-date="${d}">+ Add</button></div>${its.map(p=>`<button class="item" data-act="shEdit" data-sec="sharedPlans" data-id="${p.id}"><span class="mono small" style="width:44px">${esc(p.time||"–")}</span><div class="main"><div class="t">${esc(p.title)}</div><div class="s">${esc([p.place,p.note,p.by?"added by "+p.by:""].filter(Boolean).join(" · "))}</div></div></button>`).join("")||`<div class="item small muted" style="cursor:default">Nothing planned yet</div>`}`; }).join("")}</div>`;
  }
  if (seg==="exp"){
    body = `<button class="btn primary" data-act="add" data-sec="sharedExp">Add shared expense</button>` + (exp.length?`<div class="list">${exp.map(e=> e.transfer
      ? `<button class="item" data-act="shEdit" data-sec="sharedExp" data-id="${e.id}"><span class="tag good">Paid back</span><div class="main"><div class="t">${esc(e.from)} paid ${esc(e.to)}</div><div class="s">${fmtDW(e.date)}</div></div><div class="r num">${money(e.tripAmt,cur)}</div></button>`
      : `<button class="item" data-act="shEdit" data-sec="sharedExp" data-id="${e.id}"><span class="dot" style="background:${CAT_COLORS[e.cat]||"var(--muted)"}"></span><div class="main"><div class="t">${esc(e.note||e.cat)}</div><div class="s">${esc(e.paidBy)} paid · split ${(e.split&&e.split.length)?e.split.length:members.length} ways · ${fmtD(e.date)}</div></div><div class="r num" style="font-weight:600">${money(e.amount,e.cur)}${e.cur!==cur?`<div class="small muted">${money(e.tripAmt,cur)}</div>`:""}</div></button>`).join("")}</div>`:`<div class="empty">No shared expenses yet. Whoever pays adds it, and the app splits it.</div>`)
      + `<div class="small muted num">Trip total ${money(total,cur)}${members.length?` · ${money(total/members.length,cur)} each on average`:""}</div>`;
  }
  if (seg==="bal"){
    const bal = shBalances(id), plan = shSettle(bal);
    body = `<div class="list">${Object.entries(bal).map(([n,v])=>`<div class="item" style="cursor:default"><div class="main"><div class="t">${esc(n)}${me&&sameName(n,me)?' <span class="tag accent">You</span>':""}</div></div><div class="r num" style="font-weight:600;color:${v>0.005?"var(--good)":v<-0.005?"var(--bad)":"var(--muted)"}">${Math.abs(v)<0.005?"square":(v>0?"gets back ":"owes ")+money(Math.abs(v),cur)}</div></div>`).join("")}</div>
      <h3>Fewest payments to settle up</h3>${plan.length?`<div class="list">${plan.map(p=>`<div class="item" style="cursor:default"><div class="main"><div class="t">${esc(p.from)} pays ${esc(p.to)}</div><div class="s num">${money(p.amt,cur)}</div></div><button class="btn sm" data-act="shPaid" data-from="${esc(p.from)}" data-to="${esc(p.to)}" data-amt="${p.amt}">Mark paid</button></div>`).join("")}</div>`:`<div class="empty">Everyone is square.</div>`}`;
  }
  const whoami = me && members.some(m=>sameName(m,me)) ? "" : `<div class="banner"><span>Which one is you?</span><span class="row">${members.map(m=>`<button class="chip" data-act="iam" data-n="${esc(m)}">${esc(m)}</button>`).join("")}<button class="chip" data-act="addMe">I'm not listed</button></span></div>`;
  return `<div class="row between"><button class="btn ghost sm" data-act="shOpen" data-id="">‹ Shared trips</button><span class="row"><button class="btn sm primary" data-act="invite">Invite friends</button><button class="btn sm" data-act="shEdit" data-sec="sharedTrips" data-id="${id}">Edit</button></span></div>
    <div class="card stack"><div><div class="eyebrow">${tr.dest?esc(tr.dest)+" · ":""}Shared trip</div><h2 style="font-size:1.5rem">${esc(tr.name)}</h2><div class="muted">${fmtDW(tr.start)} – ${fmtDW(tr.end)}</div></div>
    <div class="row">${members.map(m=>`<span class="tag${me&&sameName(m,me)?" accent":""}">${esc(m)}</span>`).join("")}</div></div>${whoami}${segH}${body}`;
}
function shRef(sec, tid, id){
  if (sec==="sharedTrips") return db.collection("shared").doc(id);
  return db.collection("shared").doc(tid).collection(sec==="sharedExp"?"expenses":"plans").doc(id);
}
async function shWrite(sec, tid, rec, del){
  try { const ref = shRef(sec, tid, rec.id); if (del) await ref.delete(); else { const body = Object.assign({}, rec); delete body.id; await ref.set(body); } return true; }
  catch(e){ toast(e && e.code==="permission-denied" ? "You're not in this trip any more. Ask for a new invite link." : "Couldn't save. Check your connection."); return false; }
}

/* ---------- render + events ---------- */
function render(){
  const gated = !["in","local","offline"].includes(AUTH.state) && !(AUTH.state==="loading" && localOwner());
  document.querySelector("nav.tabs").hidden = gated;
  if (gated){ document.getElementById("app").innerHTML = viewGate(); return; }
  renderTabs();
  const v = {home:viewHome, money:viewMoney, travel:viewTravel, school:viewSchool, more:viewMore}[ui.tab] || viewHome;
  document.getElementById("app").innerHTML = v();
}
document.addEventListener("click", ev=>{
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, ds = el.dataset;
  if (a==="scrim"){ if (ev.target===el) closeSheet(); return; }
  if (a!=="wipe") ui.wipeArm = false;
  switch(a){
    case "tab": ui.tab = ds.k; ui.more = null; try{localStorage.setItem("xc.tab",ds.k);}catch(e){} render(); window.scrollTo(0,0); break;
    case "close": closeSheet(); break;
    case "add": { const preset = {}; if (ds.trip) preset.tripId = ds.trip; if (ds.date){ if (ds.sec==="plans"||ds.sec==="sharedPlans") preset.date = ds.date; if (ds.sec==="trips"){ preset.start = ds.date; preset.end = ds.end||ds.date; } if (ds.sec==="flights") preset.dep = ds.date+"T09:00"; if (ds.sec==="stays"){ preset.checkin = ds.date; preset.checkout = ds.end||ds.date; } }
      if (ds.day!=null) preset.day = ds.day; openSheet(ds.sec,null,preset); break; }
    case "edit": openSheet(ds.sec, ds.id); break;
    case "del": if (!sheet.confirmDelete){ sheet.confirmDelete = true; renderSheet(); } else if (sheet.sec.startsWith("shared")){ const sec = sheet.sec, id = sheet.id, tid = sec==="sharedTrips" ? id : SH.open;
        closeSheet();
        const subs = sec==="sharedTrips" ? (SH.exp[id]||[]).map(e=>shWrite("sharedExp",id,e,true)).concat((SH.plans[id]||[]).map(p=>shWrite("sharedPlans",id,p,true))) : [];
        if (sec==="sharedTrips") SH.open = null;
        // remove a trip's expenses and plans first: once the trip is gone, nobody is a member any more
        Promise.all(subs).then(()=>shWrite(sec, tid, {id}, true)).then(ok=>ok&&toast("Deleted")); } else { const sec = sheet.sec; gsTomb(sec, sheet.id); S[sec] = S[sec].filter(x=>x.id!==sheet.id); if (sec==="trips"){ S.plans = S.plans.filter(p=>p.tripId!==sheet.id); ui.openTrip = null; } closeSheet(); save(sec,"plans"); toast("Deleted"); } break;
    case "settings": openSheet("settings"); break;
    case "month": { const [y,m] = ui.month.split("-").map(Number); const d = new Date(y, m-1+Number(ds.d), 1); ui.month = d.getFullYear()+"-"+pad(d.getMonth()+1); render(); break; }
    case "tseg": ui.travelSeg = ds.k; ui.openTrip = null; SH.open = null; render(); break;
    case "trip": ui.tab = "travel"; ui.travelSeg = "trips"; ui.openTrip = ds.id || null; render(); window.scrollTo(0,0); break;
    case "day": ui.schoolDay = Number(ds.i); render(); break;
    case "more": ui.tab = "more"; ui.more = ds.k || null; render(); window.scrollTo(0,0); break;
    case "toggle": { const it = S[ds.sec].find(x=>x.id===ds.id); if (it){ it.done = !it.done; save(ds.sec); } break; }
    case "unpack": S.packing.forEach(p=>{ if ((p.list||"Before departure")===ds.l) p.done=false; }); save("packing"); break;
    case "spainAdmin": SPAIN_ADMIN.forEach(([title,kind,n])=>S.deadlines.push({id:uidGen(),title,kind,course:"",due:addDays(today(),n),done:false,spain:true,note:"Suggested date, adjust it"})); save("deadlines"); toast("Checklist added"); break;
    case "sosStarter": EMERGENCY_STARTER.forEach(([label,value,note])=>S.contacts.push({id:uidGen(),label,value,note})); save("contacts"); break;
    case "packStarter": STARTER.forEach(([text,list])=>S.packing.push({id:uidGen(),text,list,done:false})); save("packing"); break;
    case "settle": { const v = Number(ds.v), n = ds.n; S.expenses.push({id:uidGen(),date:today(),cat:"Other",note:"Settled up with "+n,amount:Math.abs(v),cur:S.settings.home,paidBy:v>0?n:"me",splitWith:"",tripId:"",settle:true,person:n,delta:v});
      // a settlement is a transfer: it zeroes the balance and doesn't count as spending
      save("expenses"); toast("Settled with "+n); break; }
    case "copy": { const v = ds.v; navigator.clipboard.writeText(v).then(()=>toast("Copied"),()=>toast(v)); break; }
    case "shOpen": SH.open = ds.id || null; SH.seg = "plan"; render(); window.scrollTo(0,0); break;
    case "shSeg": SH.seg = ds.k; render(); break;
    case "invite": { const url = location.origin + location.pathname + "#join=" + SH.open; const tr = shTrip(SH.open);
      const text = "Join our trip \""+(tr?tr.name:"")+"\" in Exchange Companion: ";
      if (navigator.share){ navigator.share({title:tr?tr.name:"Trip", text, url}).catch(()=>{}); }
      else navigator.clipboard.writeText(url).then(()=>toast("Invite link copied"),()=>toast(url));
      break; }
    case "addMe": { if (!myName()){ toast("Set your name first"); openSheet("settings"); break; }
      db.collection("shared").doc(SH.open).update({members: firebase.firestore.FieldValue.arrayUnion(myName())}).then(()=>toast("Added you to the trip"),()=>toast("Couldn't add you. Check your connection."));
      break; }
    case "shEdit": openSheet(ds.sec, ds.id); break;
    case "iam": S.settings.myName = ds.n; save("settings"); toast("Got it, you're "+ds.n); break;
    case "shPaid": { const tr = shTrip(SH.open); const amt = Math.round(Number(ds.amt)*100)/100; shWrite("sharedExp", SH.open, {id:uidGen(), transfer:true, from:ds.from, to:ds.to, amount:amt, cur:tr.cur||"EUR", tripAmt:amt, date:today(), by:myName()}).then(ok=>ok&&toast("Marked as paid")); break; }
    case "semester": { const s = SEMESTERS[Number(ds.i)]; document.getElementById("s_start").value = s[1]; document.getElementById("s_end").value = s[2]; break; }
    case "gsSave": { const u = document.getElementById("gs_url").value.trim(), t = document.getElementById("gs_tok").value.trim();
      if (!/^https:\/\/script\.google\.com\//.test(u)){ GS.err = "That doesn't look like the web app link. It starts with https://script.google.com/macros/s/"; render(); break; }
      if (!t){ GS.err = "Paste the secret too."; render(); break; }
      S.settings.gsync = {url:u, token:t}; GS.err = ""; cacheLocal(); render(); gsSync(true); break; }
    case "gsNow": gsSync(true); break;
    case "signIn": signIn(); break;
    case "signOut": signOut(); break;
    case "gsOff": delete S.settings.gsync; GS.err = ""; cacheLocal(); render(); toast("Sheets unlinked"); break;
    case "loadEx": loadExamples(); break;
    case "clearEx": clearAll(); toast("Examples cleared"); break;
    case "export": exportData(); break;
    case "import": document.getElementById("importFile").click(); break;
    case "wipe": if (!ui.wipeArm){ ui.wipeArm = true; render(); } else { ui.wipeArm = false; S = blank(); save(...SECTIONS); toast("Everything erased"); } break;
  }
});
document.addEventListener("keydown", ev=>{ if (ev.key==="Escape" && sheet) closeSheet(); });

initStore();
})();
