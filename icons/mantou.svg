<svg xmlns="http://www.w3.org/2000/svg" viewBox="88 92 336 336">
  <defs>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9611E"/>
      <stop offset=".55" stop-color="#D98A3A"/>
      <stop offset="1" stop-color="#EDB66A"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
